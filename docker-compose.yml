services:

  backend:
    image: vishwapriyanvt/devops-backend:latest
    build:
      context: ./backend

    container_name: devops-backend
    restart: unless-stopped

    environment:
      NODE_ENV: production
      APP_VERSION: ${APP_VERSION:-1.0.2}

    expose:
      - "5000"

    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://localhost:5000/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"
      interval: 30s
      timeout: 5s
      retries: 3

  frontend:
    image: vishwapriyanvt/devops-frontend:latest
    build:
      context: ./frontend

    container_name: devops-frontend
    restart: unless-stopped

    ports:
      - "80:80"

    depends_on:
      backend:
        condition: service_healthy